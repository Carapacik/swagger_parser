---
openapi: 3.0.4
info:
  title: Batch stations
  version: '1'
paths:
  "/stations/{id}":
    get:
      operationId: getStation
      summary: Get a station.
      tags:
      - Stations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Station
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Station"
  "/health":
    get:
      operationId: getHealth
      responses:
        '204':
          description: OK
components:
  schemas:
    Station:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          type: string
    Unused:
      type: object
      properties:
        note:
          type: string
servers:
- url: https://example.test
