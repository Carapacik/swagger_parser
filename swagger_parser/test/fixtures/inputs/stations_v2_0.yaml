---
swagger: '2.0'
info:
  title: Batch stations
  version: '1'
paths:
  "/stations/{id}":
    get:
      operationId: getStation
      summary: Get a station.
      tags:
      - Stations
      parameters:
      - name: id
        in: path
        required: true
        type: string
      responses:
        '200':
          description: Station
          schema:
            "$ref": "#/definitions/Station"
  "/health":
    get:
      operationId: getHealth
      responses:
        '204':
          description: OK
definitions:
  Station:
    type: object
    additionalProperties: false
    required:
    - id
    properties:
      id:
        type: string
  Unused:
    type: object
    properties:
      note:
        type: string
host: example.test
schemes:
- https
produces:
- application/json
