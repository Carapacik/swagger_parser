swagger: "2.0"
info:
  title: "Mapped object API"
  version: "1"
paths: {}
consumes:
  - "application/json"
produces:
  - "application/json"
definitions:
  Target:
    type: "object"
    properties:
      point:
        type: "object"
        required:
          - "latitude"
          - "longitude"
        properties:
          latitude:
            type: "number"
            minimum: -90
            maximum: 90
          longitude:
            type: "number"
            minimum: -180
            maximum: 180
        additionalProperties: false
        default:
          latitude: 3
          longitude: 4
