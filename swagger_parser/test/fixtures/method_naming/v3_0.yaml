"paths":
  "/stations/{id}":
    "get":
      "operationId": "lookupStation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Station"
        "404":
          "description": "Missing"
  "/a/{b}/c/{d}/{e}":
