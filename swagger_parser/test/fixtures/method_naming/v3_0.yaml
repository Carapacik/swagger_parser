          "name": "b"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "d"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "e"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "type": "string"
