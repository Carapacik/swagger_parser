swagger: "2.0"
info:
  title: "Validation"
  version: "1"
paths: {}
definitions:
  Detail:
    type: "object"
    required:
      - "code"
    properties:
      code:
        type: "string"
        minLength: 2
  Station:
    type: "object"
    required:
      - "name"
      - "capacity"
      - "nullableName"
    properties:
      name:
        type: "string"
        minLength: 2
        maxLength: 5
        pattern: "^[A-Z]+$"
      capacity:
        type: "integer"
        minimum: 0
        maximum: 10
      nullableName:
        type: "string"
        x-nullable: true
        minLength: 2
      optionalName:
        type: "string"
        x-nullable: true
        minLength: 2
      step:
        type: "number"
        multipleOf: 0.1
      values:
        type: "array"
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          type: "number"
      details:
        $ref: "#/definitions/Detail"
      lines:
        type: "array"
        items:
          $ref: "#/definitions/Detail"
      labels:
        type: "object"
        minProperties: 1
        maxProperties: 2
        additionalProperties:
          type: "string"
          minLength: 2
      "a/b~c":
        type: "integer"
        minimum: 5
      validate:
        type: "string"
        minLength: 2
      tree:
        $ref: "#/definitions/Node"
      external:
        $ref: "external_v2.yaml#/definitions/Name"
  Node:
    type: "object"
    required:
      - "label"
    properties:
      label:
        type: "string"
        minLength: 1
      children:
        type: "array"
        items:
          $ref: "#/definitions/Node"
  OpenRequired:
    type: "object"
    required:
      - "token"
    additionalProperties: true
  Price:
    type: "number"
    minimum: 0
    exclusiveMinimum: true
    maximum: 100
    exclusiveMaximum: true
  Objects:
    type: "array"
    uniqueItems: true
    items:
      type: "object"
      additionalProperties: true
  Combined:
    allOf:
      - $ref: "#/definitions/Detail"
      - type: "object"
        properties:
          count:
            type: "integer"
            minimum: 1
  DtoValidationError:
    type: "object"
    required:
      - "message"
    properties:
      message:
        type: "string"
  StationValidation:
    type: "object"
    required:
      - "value"
    properties:
      value:
        type: "string"
  Status:
    type: "string"
    enum:
      - "ready"
      - "done"
