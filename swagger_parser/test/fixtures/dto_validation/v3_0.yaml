openapi: "3.0.4"
info:
  title: "Validation"
  version: "1"
paths: {}
components:
  schemas:
    Detail:
      type: "object"
      required:
        - "code"
      properties:
        code:
          type: "string"
          minLength: 2
    Station:
      type: "object"
      required:
        - "name"
        - "capacity"
        - "nullableName"
      properties:
        name:
          type: "string"
          minLength: 2
          maxLength: 5
          pattern: "^[A-Z]+$"
        capacity:
          type: "integer"
          minimum: 0
          maximum: 10
        nullableName:
          type: "string"
          nullable: true
          minLength: 2
        optionalName:
          type: "string"
          nullable: true
          minLength: 2
        step:
          type: "number"
          multipleOf: 0.1
        values:
          type: "array"
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: "number"
        details:
          $ref: "#/components/schemas/Detail"
        lines:
          type: "array"
          items:
            $ref: "#/components/schemas/Detail"
        labels:
          type: "object"
          minProperties: 1
          maxProperties: 2
          additionalProperties:
            type: "string"
            minLength: 2
        "a/b~c":
          type: "integer"
          minimum: 5
        validate:
          type: "string"
          minLength: 2
        tree:
          $ref: "#/components/schemas/Node"
        external:
          $ref: "external_v3_0.yaml#/components/schemas/Name"
    Node:
      type: "object"
      required:
        - "label"
      properties:
        label:
          type: "string"
          minLength: 1
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
    OpenRequired:
      type: "object"
      required:
        - "token"
      additionalProperties: true
    Price:
      type: "number"
      minimum: 0
      exclusiveMinimum: true
      maximum: 100
      exclusiveMaximum: true
    Objects:
      type: "array"
      uniqueItems: true
      items:
        type: "object"
        additionalProperties: true
    Combined:
      allOf:
        - $ref: "#/components/schemas/Detail"
        - type: "object"
          properties:
            count:
              type: "integer"
              minimum: 1
    DtoValidationError:
      type: "object"
      required:
        - "message"
      properties:
        message:
          type: "string"
    StationValidation:
      type: "object"
      required:
        - "value"
      properties:
        value:
          type: "string"
    Status:
      type: "string"
      enum:
        - "ready"
        - "done"
    Choice:
      oneOf:
        - title: "Text"
          type: "object"
          required:
            - "code"
          properties:
            code:
              type: "string"
              minLength: 2
        - title: "Count"
          type: "object"
          required:
            - "count"
          properties:
            count:
              type: "integer"
              minimum: 1
    Either:
      anyOf:
        - type: "string"
          minLength: 2
        - type: "number"
          minimum: 1
