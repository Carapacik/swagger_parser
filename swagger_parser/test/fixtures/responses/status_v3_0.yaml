"openapi": "3.0.4"
"info":
  "title": "Station lookup"
  "version": "1"
"paths":
  "/stations/{id}":
    "get":
      "operationId": "getStation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "$ref": "#/components/parameters/RequestId"
        -
          "$ref": "#/components/parameters/Revision"
        -
          "name": "authorization"
          "in": "header"
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Station"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Station"
  "/station":
    "parameters":
      -
        "name": "x-request-id"
        "in": "header"
        "schema":
          "type": "integer"
    "get":
      "operationId": "lookupStation"
      "parameters":
        -
          "$ref": "#/components/parameters/RequestId"
        -
          "$ref": "#/components/parameters/Revision"
        -
          "name": "authorization"
          "in": "header"
          "schema":
            "type": "string"
      "responses":
        "500":
          "description": "ServerError"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ServerError"
        "202":
          "description": "Ticket"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Ticket"
        "404":
          "description": "Problem"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "204":
          "description": "No content"
        "201":
          "description": "CreatedStation"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CreatedStation"
        "400":
          "description": "ValidationError"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationError"
        "200":
          "description": "Station"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Station"
  "/invalid":
    "get":
      "operationId": "invalid"
      "responses":
        "400":
          "description": "ValidationError"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationError"
  "/empty":
    "get":
      "operationId": "empty"
      "responses":
        "204":
          "description": "No content"
  "/created":
    "get":
      "operationId": "created"
      "responses":
        "201":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CreatedStation"
  "/listed":
    "get":
      "operationId": "listed"
      "responses":
        "204":
          "description": "Result."
        "200":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/Station"
  "/no-content":
    "get":
      "operationId": "noContent"
      "responses":
        "200":
          "description": "Result."
  "/unconstrained":
    "get":
      "operationId": "unconstrained"
      "responses":
        "200":
          "description": "Result."
          "content":
            "application/json":
              "schema": {}
  "/multi-status":
    "get":
      "operationId": "multiStatus"
      "responses":
        "207":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "state"
                "properties":
                  "state":
                    "type": "string"
                    "enum":
                      - "accepted"
                      - "partial"
  "/late-success":
    "get":
      "operationId": "lateSuccess"
      "responses":
        "500":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ServerError"
        "299":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CreatedStation"
        "226":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Ticket"
"components":
  "parameters":
    "RequestId":
      "name": "X-Request-ID"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
    "Revision":
      "name": "X-Revision"
      "in": "header"
      "schema":
        "type": "integer"
  "schemas":
    "Station":
      "type": "object"
      "required":
        - "name"
      "properties":
        "name":
          "type": "string"
    "Ticket":
      "type": "object"
      "required":
        - "token"
      "properties":
        "token":
          "type": "string"
    "Problem":
      "type": "object"
      "required":
        - "detail"
      "properties":
        "detail":
          "type": "string"
    "CreatedStation":
      "type": "object"
      "required":
        - "id"
      "properties":
        "id":
          "type": "string"
    "ValidationError":
      "type": "object"
      "required":
        - "field"
      "properties":
        "field":
          "type": "string"
    "ServerError":
      "type": "object"
      "required":
        - "requestId"
      "properties":
        "requestId":
          "type": "string"
