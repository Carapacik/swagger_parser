"openapi": "3.2.1"
"info":
  "title": "Binary responses"
  "version": "1"
"paths":
  "/pdf":
    "get":
      "operationId": "pdf"
      "responses":
        "200":
          "description": "Result."
          "content":
            "application/pdf":
              "schema":
                "type": "string"
                "format": "binary"
        "204":
          "description": "No content."
        "400":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
  "/spreadsheet":
    "get":
      "operationId": "spreadsheet"
      "responses":
        "200":
          "description": "Result."
          "content":
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
              "schema":
                "type": "string"
                "format": "binary"
        "204":
          "description": "No content."
        "400":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
  "/bytes":
    "get":
      "operationId": "bytes"
      "responses":
        "200":
          "description": "Result."
          "content":
            "application/octet-stream":
              "schema":
                "type": "string"
                "format": "binary"
        "204":
          "description": "No content."
        "400":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
  "/metadata":
    "get":
      "operationId": "metadata"
      "responses":
        "200":
          "description": "Result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
"components":
  "schemas":
    "Problem":
      "type": "object"
      "required":
        - "message"
      "properties":
        "message":
          "type": "string"
