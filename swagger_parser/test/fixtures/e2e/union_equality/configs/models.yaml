swagger_parser:
  output_directory: ../out
  generation:
    serializer: freezed
    http_client: dio
    response_mode: all_statuses
    unknown_enum_values: preserve
    unknown_discriminator_values: preserve
    unmatched_union_values: preserve
  inputs:
    json:
      schema_path: ../inputs/models.json
    yaml:
      schema_path: ../inputs/models.yaml
