openapi: "3.1.2"
info:
  title: "Transit API"
  version: "1.0.0"
paths:
  "/stations/{id}":
    get:
      operationId: getStation
      tags:
        - Stations
      summary: "Get a station."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Station data."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Station"
  "/stations":
    post:
      operationId: createStation
      tags:
        - Stations
      summary: "Create a station."
      responses:
        "201":
          description: "Station data."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Station"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StationInput"
  "/trips/{id}/station":
    get:
      operationId: getTripStation
      tags:
        - Trips
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Station data."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Station"
  "/health":
    get:
      operationId: getHealth
      deprecated: true
      responses:
        "204":
          description: "No content."
servers:
  - url: "https://example.test"
components:
  schemas:
    StationId:
      type: string
    StationState:
      type: string
      enum:
        - open
        - closed
    Entity:
      type: object
      required:
        - id
      properties:
        id:
          "$ref": "#/components/schemas/StationId"
    Station:
      description: "A passenger station."
      allOf:
        - "$ref": "#/components/schemas/Entity"
        - type: object
          required:
            - name
            - state
          properties:
            name:
              type: string
              description: "Station name."
            state:
              "$ref": "#/components/schemas/StationState"
            note:
              type:
                - string
                - "null"
            enabled:
              type: boolean
              default: true
            labels:
              type: array
              items:
                type: string
              default: []
            address:
              type: object
              additionalProperties: false
              required:
                - city
              properties:
                city:
                  type: string
    StationInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        enabled:
          type: boolean
          default: true
    Unused:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: integer
