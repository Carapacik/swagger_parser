swagger: "2.0"
info:
  title: "Transit API"
  version: "1.0.0"
paths:
  "/stations/{id}":
    get:
      operationId: getStation
      tags:
        - Stations
      summary: "Get a station."
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: language
          in: query
          type: string
      responses:
        "200":
          description: "Station data."
          schema:
            "$ref": "#/definitions/Station"
  "/stations":
    post:
      operationId: createStation
      tags:
        - Stations
      summary: "Create a station."
      responses:
        "201":
          description: "Station data."
          schema:
            "$ref": "#/definitions/Station"
      parameters:
        - name: body
          in: body
          required: true
          schema:
            "$ref": "#/definitions/StationInput"
  "/trips/{id}/station":
    get:
      operationId: getTripStation
      tags:
        - Trips
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: "Station data."
          schema:
            "$ref": "#/definitions/Station"
  "/health":
    get:
      operationId: getHealth
      deprecated: true
      responses:
        "204":
          description: "No content."
host: example.test
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
definitions:
  StationId:
    type: string
  StationState:
    type: string
    enum:
      - open
      - closed
  Entity:
    type: object
    required:
      - id
    properties:
      id:
        "$ref": "#/definitions/StationId"
  Station:
    description: "A passenger station."
    allOf:
      - "$ref": "#/definitions/Entity"
      - type: object
        required:
          - name
          - state
        properties:
          name:
            type: string
            description: "Station name."
          state:
            "$ref": "#/definitions/StationState"
          note:
            type: string
            x-nullable: true
          enabled:
            type: boolean
            default: true
          labels:
            type: array
            items:
              type: string
            default: []
          address:
            type: object
            additionalProperties: false
            required:
              - city
            properties:
              city:
                type: string
  StationInput:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
      enabled:
        type: boolean
        default: true
  Unused:
    type: object
    additionalProperties: false
    required:
      - value
    properties:
      value:
        type: integer
