openapi: '3.1.2'
info:
  title: Nullable unions
  version: '1'
paths:
  /holder:
    get:
      operationId: getHolder
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holder'
components:
  schemas:
    Card:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Reach:
      type: object
      required:
        - exclusions
      properties:
        exclusions:
          type: object
          propertyNames:
            enum:
              - a
              - b
          additionalProperties:
            type: integer
    Holder:
      type: object
      required:
        - anyCard
        - oneCard
        - text
      properties:
        anyCard:
          anyOf:
            - $ref: '#/components/schemas/Card'
            - type: 'null'
        oneCard:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Card'
        text:
          anyOf:
            - type: string
            - type: 'null'
        archived:
          anyOf:
            - type: boolean
            - type: 'null'
          default: false
        label:
          anyOf:
            - type: string
            - type: 'null'
          default: none
        cleared:
          anyOf:
            - type: string
            - type: 'null'
          default: null
        cards:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Card'
              - type: 'null'
        reach:
          anyOf:
            - $ref: '#/components/schemas/Reach'
            - type: 'null'
        choice:
          anyOf:
            - $ref: '#/components/schemas/Card'
            - $ref: '#/components/schemas/Other'
        triple:
          anyOf:
            - type: string
            - type: integer
            - type: 'null'
        constNull:
          anyOf:
            - type: string
            - const: null
        enumNull:
          oneOf:
            - enum:
                - null
            - type: integer
        zero:
          anyOf:
            - type: integer
            - type: 'null'
          default: 0
        empty:
          anyOf:
            - type: string
            - type: 'null'
          default: ''
        listDefault:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          default:
            - a
            - b
        overlap:
          oneOf:
            - type:
                - string
                - 'null'
            - type: 'null'
        named:
          $ref: '#/components/schemas/NamedNullable'
        constrained:
          type: string
          anyOf:
            - type: string
            - type: 'null'
        overlapConst:
          oneOf:
            - type:
                - string
                - 'null'
            - const: null
    Other:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    NamedNullable:
      anyOf:
        - type: string
        - type: 'null'
