"openapi": "3.1.2"
"info":
  "title": "Response decoding"
  "version": "1"
"paths":
  "/station/{scenario}":
    "get":
      "operationId": "getStation"
      "parameters":
        -
          "name": "scenario"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Station"
        "400":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
  "/states":
    "get":
      "operationId": "getStates"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/State"
  "/nullable":
    "get":
      "operationId": "getNullable"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "type":
                  - "string"
                  - "null"
  "/empty":
    "get":
      "operationId": "getEmpty"
      "responses":
        "204":
          "description": "No content"
  "/state":
    "get":
      "operationId": "getState"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/State"
  "/nullableStates":
    "get":
      "operationId": "getNullableStates"
      "responses":
        "200":
          "description": "Result"
          "content":
            "application/json":
              "schema":
                "type":
                  - "array"
                  - "null"
                "items":
                  "$ref": "#/components/schemas/State"
"components":
  "schemas":
    "Station":
      "type": "object"
      "required":
        - "name"
        - "state"
      "properties":
        "name":
          "type": "string"
        "state":
          "$ref": "#/components/schemas/State"
    "State":
      "type": "string"
      "enum":
        - "active"
        - "paused"
    "Problem":
      "type": "object"
      "required":
        - "message"
      "properties":
        "message":
          "type": "string"
