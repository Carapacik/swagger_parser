"swagger": "2.0"
"info":
  "title": "Reference contracts"
  "version": "1"
"paths":
  "/shared/~item":
    "get":
      "operationId": "sharedItem"
      "responses":
        "200":
          "description": "Shared response"
          "schema":
            "$ref": "#/definitions/ExternalObject"
"consumes":
  - "application/json"
"produces":
  - "application/json"
"definitions":
  "ExternalDate":
    "type": "string"
    "format": "date"
  "ExternalTimestamp":
    "type": "string"
    "format": "date-time"
  "Credentials":
    "type": "object"
    "required":
      - "login"
      - "password"
    "properties":
      "login":
        "type": "string"
      "password":
        "type": "string"
  "ExternalObject":
    "type": "object"
    "required":
      - "external"
    "properties":
      "external":
        "type": "string"
  "Problem":
    "type": "object"
    "required":
      - "message"
    "properties":
      "message":
        "type": "string"
"parameters":
  "Tag":
    "name": "tag"
    "in": "query"
    "required": false
    "type": "array"
    "items":
      "type": "string"
    "default":
      - "north"
      - "south"
    "description": "Repeated station tags."
    "collectionFormat": "multi"
  "Limit":
    "name": "limit"
    "in": "query"
    "required": false
    "type": "integer"
    "format": "int32"
    "default": 7
    "description": "Operation limit."
  "HeaderLimit":
    "name": "limit"
    "in": "header"
    "required": false
    "type": "integer"
    "default": 9
    "description": "Header limit."
  "Id":
    "name": "id"
    "in": "path"
    "required": true
    "type": "string"
    "description": "Station key."
  "CredentialsBody":
    "description": "Shared credentials."
    "required": true
    "name": "credentials"
    "in": "body"
    "schema":
      "$ref": "#/definitions/Credentials"
  "LoginField":
    "name": "login"
    "in": "formData"
    "required": true
    "type": "string"
  "PasswordField":
    "name": "password"
    "in": "formData"
    "required": true
    "type": "string"
"responses":
  "Problem":
    "description": "Shared error."
    "schema":
      "$ref": "#/definitions/Problem"
  "ExternalObject":
    "description": "Shared response"
    "schema":
      "$ref": "#/definitions/ExternalObject"
