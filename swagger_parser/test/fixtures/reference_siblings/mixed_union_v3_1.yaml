openapi: 3.1.2
info:
  title: Reference siblings
  version: '1'
paths:
  /frame:
    get:
      operationId: getFrame
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: &id001
                type: object
                $ref: '#/components/schemas/Frame'
components:
  schemas:
    A:
      type: object
      required:
      - channel
      properties:
        channel:
          type: string
    B:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    Frame:
      anyOf:
      - $ref: '#/components/schemas/A'
      - type: string
    Envelope:
      type: object
      required:
      - frame
      properties:
        frame: *id001
