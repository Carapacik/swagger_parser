name: Bug report
description: Report incorrect behavior or generated code.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Write a short English title that describes the failure. Omit type prefixes.
  - type: dropdown
    id: packages
    attributes:
      label: Affected packages
      multiple: true
      options:
        - swagger_parser
        - swagger_parser_core
        - swagger_parser_templates
        - swagger_parser_pages
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include package versions, Dart or Flutter version, and OS or browser. For generated code, include the HTTP and serializer packages.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps and commands. Include the config or API call.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: OpenAPI input
      description: Paste a minimal JSON or YAML document, or attach the files. Include external references needed to reproduce the failure.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the expected behavior or show the expected code.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error, relevant logs, or generated code. Use code blocks for text output.
    validations:
      required: true
