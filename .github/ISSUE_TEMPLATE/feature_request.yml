name: Feature request
description: Propose a new or improved capability.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Write a short English title that names the requested capability. Omit type prefixes.
  - type: dropdown
    id: packages
    attributes:
      label: Affected packages
      multiple: true
      options:
        - swagger_parser
        - swagger_parser_core
        - swagger_parser_templates
        - swagger_parser_pages
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the task and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you need. Include an example API or generated code.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: OpenAPI input
      description: Include a JSON or YAML example when the proposal depends on a schema.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any workaround and its limitations.
